[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in LLM"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=1.15.0",
    "pydantic>=2.14.1",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "mypy",
	"flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
follow_imports = "skip"

[tool.hatch.build.targets.wheel]
packages = ["call-me-maybe"]
